name: Telegram ingest

# Runs on a schedule instead of as an always-on worker, so ingestion needs no
# always-on host at all — see backend/app/ingest/telegram.py's poll() for why.
# GitHub's schedule trigger is best-effort and can lag under load, so treat
# 15 minutes as a floor, not a guarantee.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Telegram session
        run: |
          mkdir -p data
          echo "$TELEGRAM_SESSION_B64" | base64 -d | gunzip > data/kaki.session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}

      - name: Poll for new games
        run: python -m scripts.poll_ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT || 'sg_badminton' }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          TELEGRAM_SESSION_PATH: ./data/kaki.session
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENVIRONMENT: production
